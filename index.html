<!DOCTYPE html>
<html lang="en" data-theme="ios27" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUASAR-9 | Enterprise AI CRM & Google Workspace OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --radius-card: 1.35rem;
      --text-primary: #f8fafc;
      --text-secondary: rgba(226, 232, 240, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.2);
      --highlight-rim: rgba(255, 255, 255, 0.34);
      --bg-canvas: #040712;

      /* 10-Shade Spectrum (iOS 27 Dark Default) */
      --s-50: #e0f2fe;
      --s-100: #bae6fd;
      --s-200: #7dd3fc;
      --s-300: #38bdf8;
      --s-400: #0ea5e9;
      --s-500: #0a84ff;
      --s-600: #0284c7;
      --s-700: #0369a1;
      --s-800: #075985;
      --s-900: #030816;
    }

    html[data-mode='light'] {
      --text-primary: #0f172a;
      --text-secondary: rgba(15, 23, 42, 0.8);
      --border-subtle: rgba(15, 23, 42, 0.16);
      --highlight-rim: rgba(255, 255, 255, 0.75);
      --bg-canvas: #eef4fc;
    }

    html[data-theme='ios27'] {
      --radius-card: 1.4rem;
      --s-50: #e0f2fe; --s-100: #bae6fd; --s-200: #7dd3fc; --s-300: #38bdf8;
      --s-400: #0ea5e9; --s-500: #0a84ff; --s-600: #0284c7; --s-700: #0369a1;
      --s-800: #075985; --s-900: #030816;
    }

    html[data-theme='gemini'] {
      --radius-card: 1.55rem;
      --s-50: #fce8e6; --s-100: #f3e8ff; --s-200: #d8b4fe; --s-300: #c084fc;
      --s-400: #9b72cb; --s-500: #4285f4; --s-600: #6366f1; --s-700: #4f46e5;
      --s-800: #311068; --s-900: #09071a;
    }

    html[data-theme='oneui'] {
      --radius-card: 1.85rem;
      --s-50: #dbeafe; --s-100: #bfdbfe; --s-200: #93c5fd; --s-300: #60a5fa;
      --s-400: #3e82f7; --s-500: #1259ff; --s-600: #1d4ed8; --s-700: #1e40af;
      --s-800: #1e3a8a; --s-900: #040a1c;
    }

    html[data-theme='harmonyos'] {
      --radius-card: 1.35rem;
      --s-50: #ccfbf1; --s-100: #99f6e4; --s-200: #5eead4; --s-300: #2dd4bf;
      --s-400: #00e5ff; --s-500: #00bfa5; --s-600: #0d9488; --s-700: #0f766e;
      --s-800: #115e59; --s-900: #021412;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 12% 14%, color-mix(in srgb, var(--s-500) 26%, transparent), transparent 45%),
        radial-gradient(circle at 86% 22%, color-mix(in srgb, var(--s-300) 22%, transparent), transparent 42%),
        radial-gradient(circle at 72% 85%, color-mix(in srgb, var(--s-700) 28%, transparent), transparent 48%),
        radial-gradient(circle at 24% 88%, color-mix(in srgb, var(--s-400) 20%, transparent), transparent 44%);
      overflow-x: hidden;
    }

    #vector-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* 92% Transparent + 5px Blur Liquid Glass */
    .glass {
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-300) 8%, transparent),
        color-mix(in srgb, var(--s-600) 8%, transparent)
      );
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 1px 0 var(--highlight-rim), 0 10px 30px rgba(0, 0, 0, 0.22);
      border-radius: var(--radius-card);
    }

    .glass-pill {
      border-radius: 9999px;
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-400) 8%, transparent),
        color-mix(in srgb, var(--s-700) 8%, transparent)
      );
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .glass-pill:hover {
      transform: translateY(-1px);
      border-color: var(--s-300);
    }

    .glass-pill.active {
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-400) 14%, transparent),
        color-mix(in srgb, var(--s-500) 10%, transparent)
      );
      border: 1px solid var(--s-200);
      box-shadow:
        0 0 20px color-mix(in srgb, var(--s-500) 60%, transparent),
        0 0 8px color-mix(in srgb, var(--s-300) 45%, transparent),
        inset 0 1px 0 var(--s-50);
      font-weight: 700;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.topbar {
      position: sticky;
      top: 0.75rem;
      z-index: 40;
      margin: 0.75rem auto 0;
      width: min(1440px, calc(100% - 1.5rem));
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .hex-menu-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 0.9rem;
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
      backdrop-filter: blur(5px);
      border: 1px solid var(--s-300);
      color: var(--text-primary);
      cursor: pointer;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 0.06em;
      font-size: 1.05rem;
      background: linear-gradient(90deg, var(--s-50), var(--s-300), var(--s-500), var(--s-200));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @keyframes blackholeOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orbit-group {
      transform-origin: 24px 24px;
      animation: blackholeOrbit 5.5s linear infinite;
    }

    .search-box {
      flex: 1 1 220px;
      max-width: 380px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--s-600) 8%, transparent);
      backdrop-filter: blur(5px);
      border: 1px solid var(--border-subtle);
    }

    input, select, textarea {
      width: 100%;
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
      backdrop-filter: blur(5px);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 0.55rem 0.75rem;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    select option {
      background: #0f172a;
      color: #f8fafc;
    }

    .search-box input {
      background: transparent;
      border: none;
      padding: 0.15rem 0.25rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .icon-btn {
      position: relative;
      height: 38px;
      min-width: 38px;
      padding: 0 0.7rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--s-400) 8%, transparent);
      backdrop-filter: blur(5px);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .badge-dot {
      position: absolute;
      top: 4px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--s-300);
      box-shadow: 0 0 8px var(--s-400);
    }

    .workspace {
      width: min(1440px, calc(100% - 1.5rem));
      margin: 1rem auto 3rem;
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    nav.sidebar {
      position: sticky;
      top: 5.2rem;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    nav.sidebar.collapsed {
      display: none;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      padding: 0.62rem 0.95rem;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }

    .panel {
      padding: 1.25rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .muted {
      color: var(--text-secondary);
      font-size: 0.86rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    .btn-primary {
      padding: 0.55rem 1rem;
      border-radius: 9999px;
      border: 1px solid var(--s-200);
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-400) 14%, transparent),
        color-mix(in srgb, var(--s-600) 10%, transparent)
      );
      backdrop-filter: blur(5px);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 0 14px color-mix(in srgb, var(--s-500) 35%, transparent);
    }

    .btn-secondary {
      padding: 0.5rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
      backdrop-filter: blur(5px);
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .news-card {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem;
    }

    .news-img {
      width: 100%;
      height: 205px;
      object-fit: cover;
      border-radius: calc(var(--radius-card) - 0.35rem);
      border: 1px solid var(--border-subtle);
    }

    .news-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-top: 0.4rem;
      border-top: 1px solid var(--border-subtle);
    }

    .table-wrap {
      overflow-x: auto;
      border-radius: 0.9rem;
      border: 1px solid var(--border-subtle);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
    }

    th, td {
      padding: 0.65rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }

    th {
      color: var(--s-200);
      font-weight: 600;
      background: color-mix(in srgb, var(--s-700) 8%, transparent);
    }

    .terminal-box {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 0.9rem;
      border-radius: 0.9rem;
      background: color-mix(in srgb, var(--s-900) 20%, transparent);
      backdrop-filter: blur(5px);
      border: 1px solid var(--s-400);
      white-space: pre-wrap;
      max-height: 290px;
      overflow-y: auto;
    }

    .fab-ai {
      position: fixed;
      right: 1.35rem;
      bottom: 1.35rem;
      z-index: 60;
      width: 58px;
      height: 58px;
      border-radius: 9999px;
      border: 1px solid var(--s-200);
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-400) 16%, transparent),
        color-mix(in srgb, var(--s-600) 12%, transparent)
      );
      backdrop-filter: blur(5px);
      color: var(--text-primary);
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px color-mix(in srgb, var(--s-500) 65%, transparent);
      font-weight: 800;
    }

    .drawer {
      position: fixed;
      right: 1.35rem;
      bottom: 5.5rem;
      z-index: 60;
      width: min(410px, calc(100vw - 2rem));
      max-height: 74vh;
      overflow-y: auto;
      padding: 1.1rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(2, 6, 23, 0.45);
      backdrop-filter: blur(5px);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .modal-card {
      width: min(520px, 100%);
      padding: 1.25rem;
      max-height: 85vh;
      overflow-y: auto;
    }

    .pill-tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.74rem;
      border: 1px solid var(--s-300);
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
    }

    .tree-node {
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.5rem;
      border-left: 3px solid var(--s-400);
    }

    @media (max-width: 960px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      nav.sidebar {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
      }
      .nav-item {
        width: auto;
      }
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <canvas id="vector-canvas"></canvas>

  <div class="app-shell">
    <!-- Top Header Ribbon -->
    <header class="topbar glass">
      <div class="brand-group">
        <!-- Custom Sci-Fi Hexagonal Menu Trigger -->
        <button class="hex-menu-btn" id="menuToggle" title="Toggle Navigation">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2" />
            <circle cx="12" cy="12" r="3" />
            <line x1="12" y1="2" x2="12" y2="9" />
            <line x1="21" y1="17" x2="14.6" y2="13.5" />
            <line x1="3" y1="17" x2="9.4" y2="13.5" />
          </svg>
        </button>

        <!-- Animated Blackhole + Orbiting Planet Logo -->
        <div class="logo-wrap">
          <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
            <defs>
              <radialGradient id="bhCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#000000" />
                <stop offset="68%" stop-color="#050816" />
                <stop offset="100%" stop-color="var(--s-500)" />
              </radialGradient>
            </defs>
            <ellipse cx="24" cy="24" rx="20" ry="7.5" transform="rotate(-22 24 24)" stroke="var(--s-400)" stroke-width="1.5" stroke-opacity="0.7" />
            <circle cx="24" cy="24" r="9.5" fill="url(#bhCore)" stroke="var(--s-200)" stroke-width="1.4" />
            <g class="orbit-group">
              <ellipse cx="24" cy="24" rx="18" ry="18" stroke="var(--s-300)" stroke-dasharray="4 4" stroke-width="1" />
              <circle cx="42" cy="24" r="3.4" fill="var(--s-100)" />
            </g>
          </svg>
          <div>
            <div class="brand-title">QUASAR-9</div>
            <div class="muted" style="font-size: 0.7rem;">LIQUID GLASS AI OS</div>
          </div>
        </div>
      </div>

      <!-- MS Teams-style Global Directory Search -->
      <div class="search-box">
        <span style="opacity: 0.75;">⌕</span>
        <input id="globalSearch" type="text" placeholder="Search people, roles, departments, or CRM tools..." />
      </div>

      <!-- Role Switcher, Alerts, Appearance, Gmail OAuth -->
      <div class="header-actions">
        <select id="roleSelect" style="width: auto; border-radius: 9999px; padding: 0.42rem 0.75rem;" title="Active RBAC Role">
          <option value="Owner">Role: Owner</option>
          <option value="Director">Role: Director</option>
          <option value="Manager">Role: Manager</option>
          <option value="Admin">Role: Admin</option>
          <option value="Developer">Role: Developer</option>
          <option value="Agent">Role: Agent / Associate</option>
        </select>

        <button class="icon-btn" id="notifBtn" title="Notifications & Alerts">
          <span>🔔</span>
          <span id="notifCount">3</span>
          <span class="badge-dot"></span>
        </button>

        <button class="icon-btn" id="themeBtn" title="Themes & Light/Dark Mode">
          <span>◐</span>
          <span>Themes</span>
        </button>

        <!-- Gmail / Google 1-Click OAuth Icon -->
        <button class="icon-btn" id="googleAuthBtn" title="One-Click Google / Gmail OAuth">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
            <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 8.9 0 11.1 0 13.5s.6 4.6 1.6 6.5l3.7-2.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21 7.4 24 12 24z"/>
          </svg>
          <span id="authLabel">Sign In</span>
        </button>
      </div>
    </header>

    <!-- Search Results Banner -->
    <div id="searchOverlay" class="glass panel" style="display:none; width:min(1440px, calc(100% - 1.5rem)); margin: 0.75rem auto 0;"></div>

    <!-- Main Workspace -->
    <div class="workspace">
      <nav class="sidebar glass" id="sidebarNav"></nav>
      <main class="content-area" id="mainView"></main>
    </div>
  </div>

  <!-- Floating AI Assistant Button -->
  <button class="fab-ai" id="fabAiBtn" title="QUASAR-9 Omnipresent AI Copilot">AI</button>

  <!-- Floating AI Drawer -->
  <div class="drawer glass" id="aiDrawer" style="display:none;">
    <div class="section-header">
      <div>
        <strong>QUASAR-9 Copilot</strong>
        <div class="muted" style="font-size:0.74rem;">Model: Google Gemini 2.5 Pro / Ultra (Non-Flash)</div>
      </div>
      <button class="btn-secondary" id="closeAiDrawer">✕</button>
    </div>
    <div id="aiChatLog" class="terminal-box" style="margin-bottom:0.65rem; max-height:210px;"></div>
    <div style="display:flex; gap:0.45rem;">
      <input id="aiPromptInput" type="text" placeholder="Ask AI to run reports, draft email, check leaves..." />
      <button class="btn-primary" id="aiSendBtn">Run</button>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card glass" id="modalContent"></div>
  </div>

      function downloadFile(filename, content, mime) {
        try {
          const blob = new Blob([content], { type: mime });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          logAction('FILE_DOWNLOAD', `Exported ${filename}`);

      // Dense Multi-Layer Parallax Technical Vector Canvas
      function initVectorCanvas() {
        const canvas = document.getElementById('vector-canvas');
        const ctx = canvas.getContext('2d');
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);

        window.addEventListener('resize', () => {
          w = canvas.width = window.innerWidth;
          h = canvas.height = window.innerHeight;
        });

        const count = w < 768 ? 85 : 145;
        const kinds = ['stack', 'hex', 'node', 'ring', 'glyph'];
        const glyphs = ['01', 'SQL', 'API', 'P2P', 'E2E', 'AI', 'DB', '9.0'];
        const particles = Array.from({ length: count }, (_, i) => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.55,
          vy: (Math.random() - 0.5) * 0.55,
          size: 8 + Math.random() * 14,
          kind: kinds[i % kinds.length],
          glyph: glyphs[i % glyphs.length],
          rot: Math.random() * Math.PI * 2
        }));

        function getShade(varName, fallback) {
          return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || fallback;
        }

        function draw() {
          ctx.clearRect(0, 0, w, h);
          const c1 = getShade('--s-300', '#38bdf8');
          const c2 = getShade('--s-500', '#0a84ff');
          const c3 = getShade('--s-200', '#7dd3fc');

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.rot += 0.004;
            if (p.x < -30) p.x = w + 30;
            if (p.x > w + 30) p.x = -30;
            if (p.y < -30) p.y = h + 30;
            if (p.y > h + 30) p.y = -30;

            for (let j = i + 1; j < particles.length; j++) {
              const q = particles[j];
              const dx = p.x - q.x;
              const dy = p.y - q.y;
              const dist = Math.hypot(dx, dy);
              if (dist < 115) {
                ctx.strokeStyle = c2;
                ctx.globalAlpha = (1 - dist / 115) * 0.28;
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
              }
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.strokeStyle = i % 2 === 0 ? c1 : c3;
            ctx.fillStyle = c1;
            ctx.globalAlpha = 0.42;
            ctx.lineWidth = 1.1;

            if (p.kind === 'stack') {
              for (let s = -1; s <= 1; s++) {
                ctx.strokeRect(-p.size * 0.6, s * 5 - 2, p.size * 1.2, 3.5);
              }
            } else if (p.kind === 'hex') {
              ctx.beginPath();
              for (let k = 0; k < 6; k++) {
                const ang = (Math.PI / 3) * k;
                const rx = Math.cos(ang) * p.size * 0.75;
                const ry = Math.sin(ang) * p.size * 0.75;
                k === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
              }
              ctx.closePath();
              ctx.stroke();
            } else if (p.kind === 'ring') {
              ctx.beginPath();
              ctx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2);
              ctx.stroke();
            } else if (p.kind === 'glyph') {
              ctx.font = '600 10px JetBrains Mono, monospace';
              ctx.fillText(p.glyph, -10, 4);
            } else {
              ctx.beginPath();
              ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
          requestAnimationFrame(draw);
        }
        draw();
      }

      logAction('SYSTEM_BOOT', 'QUASAR-9 initialized cleanly');
      initVectorCanvas();
      renderAll();
    })();
  </script>
</body>
