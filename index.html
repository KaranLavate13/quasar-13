<!DOCTYPE html>
<html lang="en" data-theme="ios27" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUASAR-13 | Enterprise AI CRM & Google Workspace OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <!-- Google Identity Services (Direct OAuth2 option) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      --radius-card: 1.35rem;
      --text-primary: #f8fafc;
      --text-secondary: rgba(226, 232, 240, 0.8);
      --border-subtle: rgba(255, 255, 255, 0.2);
      --highlight-rim: rgba(255, 255, 255, 0.34);
      --bg-canvas: #040712;

      /* 10-Shade Spectrum (iOS 27 Dark Default) */
      --s-50: #e0f2fe; --s-100: #bae6fd; --s-200: #7dd3fc; --s-300: #38bdf8;
      --s-400: #0ea5e9; --s-500: #0a84ff; --s-600: #0284c7; --s-700: #0369a1;
      --s-800: #075985; --s-900: #030816;
    }

    html[data-mode='light'] {
      --text-primary: #0f172a;
      --text-secondary: rgba(15, 23, 42, 0.78);
      --border-subtle: rgba(15, 23, 42, 0.16);
      --highlight-rim: rgba(255, 255, 255, 0.78);
      --bg-canvas: #eef4fc;
    }

    html[data-theme='ios27'] {
      --radius-card: 1.4rem;
      --s-50: #e0f2fe; --s-100: #bae6fd; --s-200: #7dd3fc; --s-300: #38bdf8;
      --s-400: #0ea5e9; --s-500: #0a84ff; --s-600: #0284c7; --s-700: #0369a1;
      --s-800: #075985; --s-900: #030816;
    }

    html[data-theme='gemini'] {
      --radius-card: 1.55rem;
      --s-50: #fce8e6; --s-100: #f3e8ff; --s-200: #d8b4fe; --s-300: #c084fc;
      --s-400: #9b72cb; --s-500: #4285f4; --s-600: #6366f1; --s-700: #4f46e5;
      --s-800: #311068; --s-900: #09071a;
    }

    html[data-theme='oneui'] {
      --radius-card: 1.85rem;
      --s-50: #dbeafe; --s-100: #bfdbfe; --s-200: #93c5fd; --s-300: #60a5fa;
      --s-400: #3e82f7; --s-500: #1259ff; --s-600: #1d4ed8; --s-700: #1e40af;
      --s-800: #1e3a8a; --s-900: #040a1c;
    }

    html[data-theme='harmonyos'] {
      --radius-card: 1.35rem;
      --s-50: #ccfbf1; --s-100: #99f6e4; --s-200: #5eead4; --s-300: #2dd4bf;
      --s-400: #00e5ff; --s-500: #00bfa5; --s-600: #0d9488; --s-700: #0f766e;
      --s-800: #115e59; --s-900: #021412;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(circle at 12% 14%, color-mix(in srgb, var(--s-500) 26%, transparent), transparent 45%),
        radial-gradient(circle at 86% 22%, color-mix(in srgb, var(--s-300) 22%, transparent), transparent 42%),
        radial-gradient(circle at 72% 85%, color-mix(in srgb, var(--s-700) 28%, transparent), transparent 48%),
        radial-gradient(circle at 24% 88%, color-mix(in srgb, var(--s-400) 20%, transparent), transparent 44%);
      overflow-x: hidden;
    }

    #vector-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* 92% Transparent + 5px Blur Liquid Glass */
    .glass {
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-300) 8%, transparent),
        color-mix(in srgb, var(--s-600) 8%, transparent)
      );
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 1px 0 var(--highlight-rim), 0 10px 30px rgba(0, 0, 0, 0.22);
      border-radius: var(--radius-card);
    }

    .glass-pill {
      border-radius: 9999px;
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-400) 8%, transparent),
        color-mix(in srgb, var(--s-700) 8%, transparent)
      );
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .glass-pill:hover { transform: translateY(-1px); border-color: var(--s-300); }

    .glass-pill.active {
      background: linear-gradient(
        135deg,
        color-mix(in srgb, var(--s-400) 14%, transparent),
        color-mix(in srgb, var(--s-500) 10%, transparent)
      );
      border: 1px solid var(--s-200);
      box-shadow:
        0 0 20px color-mix(in srgb, var(--s-500) 60%, transparent),
        0 0 8px color-mix(in srgb, var(--s-300) 45%, transparent),
        inset 0 1px 0 var(--s-50);
      font-weight: 700;
    }

    .app-shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    header.topbar {
      position: sticky;
      top: 0.75rem;
      z-index: 40;
      margin: 0.75rem auto 0;
      width: min(1480px, calc(100% - 1.5rem));
      padding: 0.65rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .brand-group { display: flex; align-items: center; gap: 0.75rem; }

    .hex-menu-btn {
      width: 42px; height: 42px; display: grid; place-items: center;
      border-radius: 0.9rem;
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
      backdrop-filter: blur(5px);
      border: 1px solid var(--s-300);
      color: var(--text-primary);
      cursor: pointer;
    }

    .logo-wrap { display: flex; align-items: center; gap: 0.6rem; }

    .brand-title {
      font-weight: 800; letter-spacing: 0.06em; font-size: 1.05rem;
      background: linear-gradient(90deg, var(--s-50), var(--s-300), var(--s-500), var(--s-200));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    @keyframes blackholeOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .orbit-group { transform-origin: 24px 24px; animation: blackholeOrbit 5.5s linear infinite; }

    .search-box {
      flex: 1 1 220px; max-width: 420px; display: flex; align-items: center; gap: 0.5rem;
      padding: 0.45rem 0.85rem; border-radius: 9999px;
      background: color-mix(in srgb, var(--s-600) 8%, transparent);
      backdrop-filter: blur(5px); border: 1px solid var(--border-subtle);
    }

    input, select, textarea {
      width: 100%;
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
      backdrop-filter: blur(5px);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 0.75rem;
      padding: 0.55rem 0.75rem;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    select option { background: #0f172a; color: #f8fafc; }
    .search-box input { background: transparent; border: none; padding: 0.15rem 0.25rem; }

    .header-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

    .icon-btn {
      position: relative; height: 38px; min-width: 38px; padding: 0 0.8rem;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--s-400) 8%, transparent);
      backdrop-filter: blur(5px); border: 1px solid var(--border-subtle);
      color: var(--text-primary); cursor: pointer; font-size: 0.82rem; font-weight: 600;
    }

    .avatar-img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid var(--s-200); }

    .workspace {
      width: min(1480px, calc(100% - 1.5rem));
      margin: 1rem auto 3rem;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    nav.sidebar {
      position: sticky; top: 5.2rem; padding: 0.85rem;
      display: flex; flex-direction: column; gap: 0.35rem;
    }
    nav.sidebar.collapsed { display: none; }

    .nav-item {
      width: 100%; text-align: left; padding: 0.62rem 0.95rem;
      font-size: 0.86rem; display: flex; align-items: center; justify-content: space-between;
    }

    .content-area { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .panel { padding: 1.25rem; }

    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem;
    }
    .section-title { font-size: 1.15rem; font-weight: 700; }
    .muted { color: var(--text-secondary); font-size: 0.85rem; }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.85rem; }

    .btn-primary {
      padding: 0.55rem 1rem; border-radius: 9999px; border: 1px solid var(--s-200);
      background: linear-gradient(135deg, color-mix(in srgb, var(--s-400) 16%, transparent), color-mix(in srgb, var(--s-600) 12%, transparent));
      backdrop-filter: blur(5px); color: var(--text-primary); font-weight: 600; font-size: 0.84rem;
      cursor: pointer; box-shadow: 0 0 14px color-mix(in srgb, var(--s-500) 35%, transparent);
      text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    }

    .btn-secondary {
      padding: 0.48rem 0.9rem; border-radius: 9999px; border: 1px solid var(--border-subtle);
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
      backdrop-filter: blur(5px); color: var(--text-primary); font-weight: 500; font-size: 0.83rem;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
    }

    .empty-state {
      text-align: center; padding: 2rem 1.25rem;
      border: 1px dashed var(--border-subtle); border-radius: var(--radius-card);
    }

    .kpi-card { padding: 1rem; display: flex; flex-direction: column; gap: 0.35rem; }
    .kpi-val { font-size: 1.5rem; font-weight: 800; color: var(--s-100); }

    .funnel-bar-bg {
      width: 100%; height: 10px; border-radius: 9999px;
      background: color-mix(in srgb, var(--s-800) 40%, transparent);
      overflow: hidden; margin-top: 0.35rem;
    }
    .funnel-bar-fill {
      height: 100%; border-radius: 9999px;
      background: linear-gradient(90deg, var(--s-400), var(--s-200));
      transition: width 0.35s ease;
    }

    .news-card { overflow: hidden; display: flex; flex-direction: column; gap: 0.65rem; padding: 1rem; }
    .news-card a { color: var(--text-primary); text-decoration: none; }
    .news-card a:hover { color: var(--s-200); text-decoration: underline; }
    .news-actions { display: flex; align-items: center; gap: 0.45rem; padding-top: 0.45rem; border-top: 1px solid var(--border-subtle); flex-wrap: wrap; }

    .table-wrap { overflow-x: auto; border-radius: 0.9rem; border: 1px solid var(--border-subtle); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 0.65rem 0.8rem; text-align: left; border-bottom: 1px solid var(--border-subtle); }
    th { color: var(--s-200); font-weight: 600; background: color-mix(in srgb, var(--s-700) 8%, transparent); }

    .terminal-box {
      font-family: var(--font-mono); font-size: 0.81rem; padding: 0.9rem;
      border-radius: 0.9rem; background: color-mix(in srgb, var(--s-900) 24%, transparent);
      backdrop-filter: blur(5px); border: 1px solid var(--s-400);
      white-space: pre-wrap; max-height: 300px; overflow-y: auto; line-height: 1.48;
    }

    .pill-tag {
      display: inline-block; padding: 0.2rem 0.6rem; border-radius: 9999px;
      font-size: 0.74rem; border: 1px solid var(--s-300);
      background: color-mix(in srgb, var(--s-500) 8%, transparent);
    }

    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.3rem; }
    .dot-green { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .dot-amber { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }

    .fab-ai {
      position: fixed; right: 1.35rem; bottom: 1.35rem; z-index: 60;
      width: 58px; height: 58px; border-radius: 9999px; border: 1px solid var(--s-200);
      background: linear-gradient(135deg, color-mix(in srgb, var(--s-400) 18%, transparent), color-mix(in srgb, var(--s-600) 14%, transparent));
      backdrop-filter: blur(5px); color: var(--text-primary); cursor: pointer;
      display: grid; place-items: center;
      box-shadow: 0 0 24px color-mix(in srgb, var(--s-500) 65%, transparent);
      font-weight: 800; font-size: 0.9rem;
    }

    .drawer {
      position: fixed; right: 1.35rem; bottom: 5.5rem; z-index: 60;
      width: min(440px, calc(100vw - 2rem)); max-height: 76vh; overflow-y: auto; padding: 1.1rem;
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 70; background: rgba(2, 6, 23, 0.55);
      backdrop-filter: blur(5px); display: grid; place-items: center; padding: 1rem;
    }
    .modal-card { width: min(600px, 100%); padding: 1.25rem; max-height: 88vh; overflow-y: auto; }

    .tool-tile { padding: 1rem; display: flex; flex-direction: column; gap: 0.45rem; justify-content: space-between; }

    .kanban-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; }
    .kanban-col { padding: 0.75rem; min-height: 165px; }

    @media (max-width: 1080px) {
      .grid-4, .kanban-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 960px) {
      .workspace { grid-template-columns: 1fr; }
      nav.sidebar { position: static; flex-direction: row; flex-wrap: wrap; }
      .nav-item { width: auto; }
      .grid-2, .grid-3, .grid-4, .kanban-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <canvas id="vector-canvas"></canvas>

  <div class="app-shell">
    <!-- Top Header Ribbon (No Role Switcher) -->
    <header class="topbar glass">
      <div class="brand-group">
        <button class="hex-menu-btn" id="menuToggle" title="Toggle Navigation">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2" />
            <circle cx="12" cy="12" r="3" />
            <line x1="12" y1="2" x2="12" y2="9" />
            <line x1="21" y1="17" x2="14.6" y2="13.5" />
            <line x1="3" y1="17" x2="9.4" y2="13.5" />
          </svg>
        </button>

        <div class="logo-wrap">
          <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
            <defs>
              <radialGradient id="bhCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#000000" />
                <stop offset="68%" stop-color="#050816" />
                <stop offset="100%" stop-color="var(--s-500)" />
              </radialGradient>
            </defs>
            <ellipse cx="24" cy="24" rx="20" ry="7.5" transform="rotate(-22 24 24)" stroke="var(--s-400)" stroke-width="1.5" stroke-opacity="0.7" />
            <circle cx="24" cy="24" r="9.5" fill="url(#bhCore)" stroke="var(--s-200)" stroke-width="1.4" />
            <g class="orbit-group">
              <ellipse cx="24" cy="24" rx="18" ry="18" stroke="var(--s-300)" stroke-dasharray="4 4" stroke-width="1" />
              <circle cx="42" cy="24" r="3.4" fill="var(--s-100)" />
            </g>
          </svg>
          <div>
            <div class="brand-title">QUASAR-13</div>
            <div class="muted" style="font-size: 0.7rem;">ENTERPRISE AI CRM • GEMINI 3.5 FLASH-LITE</div>
          </div>
        </div>
      </div>

      <div class="search-box">
        <span style="opacity: 0.75;">⌕</span>
        <input id="globalSearch" type="text" placeholder="Search real deals, leads, Gmail, Drive, contacts, staff..." />
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="connectBtn" title="Configure Firebase Auth, Google OAuth & Gemini 3.5 Flash-Lite">
          <span id="cloudStatusDot" class="status-dot dot-amber"></span>
          <span>API Setup</span>
        </button>

        <button class="icon-btn" id="themeBtn" title="Liquid Glass Themes & Dark/Light Mode">
          <span>◐</span>
          <span>Themes</span>
        </button>

        <button class="icon-btn" id="googleAuthBtn" title="Authorize with your real Google Account">
          <svg width="18" height="18" viewBox="0 0 24 24" id="googleSvgIcon">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.7z"/>
            <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 8.9 0 11.1 0 13.5s.6 4.6 1.6 6.5l3.7-2.8z"/>
            <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21 7.4 24 12 24z"/>
          </svg>
          <span id="authLabel">Sign in with Google</span>
        </button>
      </div>
    </header>

    <div id="searchOverlay" class="glass panel" style="display:none; width:min(1480px, calc(100% - 1.5rem)); margin: 0.75rem auto 0;"></div>

    <div class="workspace">
      <nav class="sidebar glass" id="sidebarNav"></nav>
      <main class="content-area" id="mainView"></main>
    </div>
  </div>

  <!-- Floating Gemini 3.5 Flash-Lite Copilot -->
  <button class="fab-ai" id="fabAiBtn" title="QUASAR-13 Copilot (Gemini 3.5 Flash-Lite)">AI</button>

  <div class="drawer glass" id="aiDrawer" style="display:none;">
    <div class="section-header">
      <div>
        <strong>QUASAR-13 AI Copilot</strong>
        <div class="muted" style="font-size:0.74rem;">Engine: <code>gemini-3.5-flash-lite</code></div>
      </div>
      <button class="btn-secondary" id="closeAiDrawer">✕</button>
    </div>
    <div id="aiChatLog" class="terminal-box" style="margin-bottom:0.65rem; max-height:250px;">Ready on gemini-3.5-flash-lite. Add your Gemini API key in "API Setup" to run live AI reasoning.</div>
    <div style="display:flex; gap:0.45rem;">
      <input id="aiPromptInput" type="text" placeholder="Ask AI about your real deals, emails, tasks, or data..." />
      <button class="btn-primary" id="aiSendBtn">Run</button>
    </div>
  </div>

  <!-- Modal Container -->
  <div class="modal-backdrop" id="modalBackdrop" style="display:none;">
    <div class="modal-card glass" id="modalContent"></div>
  </div>

  <script type="module">
    'use strict';

    // =========================================================================
    // OPTIONAL: PASTE YOUR PUBLIC FIREBASE WEB APP CONFIG HERE (OR USE "API SETUP" BUTTON)
    // Firebase web configs are safe for client-side repos; access is secured via
    // Firebase Authorized Domains & Firestore Security Rules.
    // =========================================================================
    const INLINE_FIREBASE_CONFIG = {
      apiKey: '',
      authDomain: '',
      projectId: '',
      storageBucket: '',
      messagingSenderId: '',
      appId: ''
    };
    const INLINE_GOOGLE_OAUTH_CLIENT_ID = '';

    const GEMINI_MODEL = 'gemini-3.5-flash-lite';
    const FIREBASE_SDK = '10.14.1';
    const STORAGE_KEY = 'quasar13_clean_v3';
    const CONFIG_KEY = 'quasar13_cloud_config_v3';

    const GOOGLE_SCOPES = [
      'openid',
      'email',
      'profile',
      'https://www.googleapis.com/auth/gmail.readonly',
      'https://www.googleapis.com/auth/gmail.send',
      'https://www.googleapis.com/auth/calendar',
      'https://www.googleapis.com/auth/contacts.readonly',
      'https://www.googleapis.com/auth/drive.readonly'
    ];

    const NEWS_CATEGORIES = [
      { id: 'TOP', label: 'Top Stories', rss: 'https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en' },
      { id: 'TECHNOLOGY', label: 'Technology', rss: 'https://news.google.com/rss/headlines/section/topic/TECHNOLOGY?hl=en-IN&gl=IN&ceid=IN:en' },
      { id: 'BUSINESS', label: 'Business', rss: 'https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-IN&gl=IN&ceid=IN:en' },

    function nowStamp() {

      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`;

    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      logAction('EXPORT_FILE', filename);
    }

    async function callGemini35FlashLite(promptText, opts = {}) {
      if (!config.geminiApiKey) {
        return '⚠️ Gemini API key not configured. Click "API Setup" in the top bar and enter your Google AI Studio key to run gemini-3.5-flash-lite.';
      }

      const memoryBlock = state.aiMemories.length
        ? '\nOrganization AI Memory Rules:\n' + state.aiMemories.map(m => `- ${m.title}: ${m.instruction}`).join('\n')
        : '';

      const crmSnapshot = JSON.stringify({

        counts: {
          deals: state.deals.length,
          leads: state.leads.length,

          gmailSynced: runtime.gmailMessages.length,
          contactsSynced: runtime.contactsList.length,

        },
        deals: state.deals.slice(0, 25),
        leads: state.leads.slice(0, 25),
        tasks: state.tasks.slice(0, 25)
      });

      const sysInstruction =
        `You are QUASAR-13 Enterprise AI Copilot running on Google ${GEMINI_MODEL}. ` +
        `Never invent fictional data, names, or financial numbers. Base every response strictly on the real workspace state below.\n` +
        `Live Workspace State: ${crmSnapshot}${memoryBlock}\n${opts.systemContext || ''}`;

      const userParts = [{ text: promptText }];
      if (opts.inlineData) userParts.push({ inline_data: opts.inlineData });

      const payload = {
        system_instruction: { parts: [{ text: sysInstruction }] },
        contents: [{ role: 'user', parts: userParts }]
      };
      if (opts.thinkingLevel) {
        payload.generationConfig = { thinkingConfig: { thinkingLevel: opts.thinkingLevel } };
      }

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-goog-api-key': config.geminiApiKey.trim()
            },
            body: JSON.stringify(payload)
          }
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);
        const text = data.candidates?.[0]?.content?.parts
          ?.filter(p => !p.thought && p.text)
          .map(p => p.text)
          .join('\n') || 'No response returned.';
        logAction('GEMINI_35_FLASH_LITE', promptText.slice(0, 85));
        return text;
      } catch (err) {
        return `❌ Gemini 3.5 Flash-Lite Error: ${err.message}`;
      }
    }

    async function hydrateWorkspaceFromCloud(uid) {
      if (!runtime.firestoreDb || !uid) return;
      try {
        const { doc, getDoc } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/firebase-firestore.js`);
        const snap = await getDoc(doc(runtime.firestoreDb, 'quasar13_workspaces', uid));
        if (snap.exists()) {
          const d = snap.data();
          if (Array.isArray(d.deals) && !state.deals.length) state.deals = d.deals;
          if (Array.isArray(d.leads) && !state.leads.length) state.leads = d.leads;
          if (Array.isArray(d.tasks) && !state.tasks.length) state.tasks = d.tasks;
          if (Array.isArray(d.employees) && d.employees.length > state.employees.length) state.employees = d.employees;
          if (Array.isArray(d.leaves) && !state.leaves.length) state.leaves = d.leaves;
          if (Array.isArray(d.aiMemories) && !state.aiMemories.length) state.aiMemories = d.aiMemories;
          if (d.newsPrefs) state.newsPrefs = d.newsPrefs;

    async function initFirebaseIfConfigured() {
      if (!config.firebaseConfigJson) return false;
      try {
        const fbConfig = JSON.parse(config.firebaseConfigJson);
        if (!fbConfig.apiKey || !fbConfig.authDomain) return false;

        const { initializeApp, getApps } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/firebase-app.js`);
        const {
          getAuth,
          setPersistence,
          browserLocalPersistence,
          onAuthStateChanged,
          getRedirectResult,
          GoogleAuthProvider
        } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/firebase-auth.js`);
        const {
          getFirestore,
          collection,
          query,
          orderBy,
          limit,
          onSnapshot
        } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/firebase-firestore.js`);

        runtime.firebaseApp = getApps().length ? getApps()[0] : initializeApp(fbConfig);
        runtime.firebaseAuth = getAuth(runtime.firebaseApp);
        runtime.firestoreDb = getFirestore(runtime.firebaseApp);

        // Remember user across every refresh
        await setPersistence(runtime.firebaseAuth, browserLocalPersistence);

        // Handle redirect sign-in result if popup fallback was triggered on tablet/mobile
        try {
          const redir = await getRedirectResult(runtime.firebaseAuth);
          if (redir) {
            const cred = GoogleAuthProvider.credentialFromResult(redir);
            if (cred?.accessToken) {
              runtime.googleAccessToken = cred.accessToken;
              sessionStorage.setItem('quasar13_google_token', cred.accessToken);
            }
          }
        } catch {}

        onAuthStateChanged(runtime.firebaseAuth, (fbUser) => {
          if (fbUser) {
            setAuthenticatedUser({
              uid: fbUser.uid,
              name: fbUser.displayName || fbUser.email,
              email: fbUser.email,
              photo: fbUser.photoURL || '',
              provider: 'Firebase Google Auth'
            });
            hydrateWorkspaceFromCloud(fbUser.uid);

            try {
              if (runtime.unsubscribeChat) runtime.unsubscribeChat();
              const q = query(collection(runtime.firestoreDb, 'quasar13_org_chat'), orderBy('createdAt', 'asc'), limit(120));
              runtime.unsubscribeChat = onSnapshot(q, (snap) => {
                state.orgMessages = snap.docs.map(d => d.data());
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                if (state.activeTab === 'chat') renderMainView();
              }, () => {});
            } catch {}

            if (runtime.googleAccessToken) fetchAllGoogleWorkspaceData();
          }
        });
        return true;
      } catch (err) {
        console.warn('Firebase init error:', err);
        return false;
      }
    }

    async function authorizeWithGoogle(silentHintEmail = '') {
      // Path 1: Real Firebase GoogleAuthProvider (shows real Google Account chooser)
      if (config.firebaseConfigJson && !silentHintEmail) {
        try {
          const ok = runtime.firebaseAuth ? true : await initFirebaseIfConfigured();
          if (!ok || !runtime.firebaseAuth) throw new Error('Invalid Firebase Web Config JSON.');
          const { GoogleAuthProvider, signInWithPopup, signInWithRedirect } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_SDK}/firebase-auth.js`);
          const provider = new GoogleAuthProvider();
          provider.setCustomParameters({ prompt: 'select_account' });
          GOOGLE_SCOPES.forEach(s => provider.addScope(s));

          try {
            const result = await signInWithPopup(runtime.firebaseAuth, provider);
            const cred = GoogleAuthProvider.credentialFromResult(result);
            if (cred?.accessToken) {
              runtime.googleAccessToken = cred.accessToken;
              sessionStorage.setItem('quasar13_google_token', cred.accessToken);
            }
            setAuthenticatedUser({
              uid: result.user.uid,
              name: result.user.displayName || result.user.email,
              email: result.user.email,
              photo: result.user.photoURL || '',
              provider: 'Firebase Google Auth'
            });
            logAction('GOOGLE_AUTH_SUCCESS', `Verified ${result.user.email} via Firebase`);
            fetchAllGoogleWorkspaceData();
          } catch (popupErr) {
            if (popupErr.code === 'auth/popup-blocked' || popupErr.code === 'auth/operation-not-supported-in-this-environment') {
              await signInWithRedirect(runtime.firebaseAuth, provider);
              return;
            }
            throw popupErr;
          }
          return;
        } catch (err) {
          alert(
            'Google Authorization Failed: ' + err.message +
            '\n\nChecklist:\n1. Firebase Console → Authentication → Sign-in method → Enable Google\n2. Authentication → Settings → Authorized domains → Add your domain (e.g. karanlavate13.github.io)'
          );
          return;
        }
      }

      // Path 2: Real Direct Google Identity Services OAuth2
      if (config.googleOAuthClientId && window.google?.accounts?.oauth2) {
        const tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: config.googleOAuthClientId.trim(),
          scope: GOOGLE_SCOPES.join(' '),
          hint: silentHintEmail || undefined,
          prompt: silentHintEmail ? '' : 'select_account',
          callback: async (tokenResp) => {
            if (tokenResp.error) {
              if (!silentHintEmail) alert('Google OAuth Error: ' + tokenResp.error);
              return;
            }
            runtime.googleAccessToken = tokenResp.access_token;
            sessionStorage.setItem('quasar13_google_token', tokenResp.access_token);
            const profRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
              headers: { Authorization: `Bearer ${tokenResp.access_token}` }
            });
            const prof = await profRes.json();
            setAuthenticatedUser({
              uid: prof.sub,
              name: prof.name || prof.email,
              email: prof.email,
              photo: prof.picture || '',
              provider: 'Google OAuth 2.0'
            });
            logAction('GOOGLE_OAUTH_SUCCESS', `Verified ${prof.email}`);
            fetchAllGoogleWorkspaceData();
          }
        });
        tokenClient.requestAccessToken();
        return;
      }

      // Never fake login: require real Firebase or Google OAuth credentials
      if (!silentHintEmail) {
        openConnectModal('Real Google authorization requires your Firebase Web Config JSON (from Firebase Console → Project Settings) OR a Google Cloud OAuth 2.0 Web Client ID. Paste one below—this app never uses pseudo sign-in.');
      }
    }

    async function googleApiFetch(url, options = {}) {
      if (!runtime.googleAccessToken) {
        throw new Error('Google Workspace OAuth access token is not active in this tab yet. Click your Google Account button → Re-authorize Google Workspace.');
      }
      const res = await fetch(url, {

          ...(options.headers || {})
        }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error?.message || `Google API HTTP ${res.status}`);

    async function fetchGmailInbox() {
      if (!runtime.googleAccessToken) return;
      runtime.gmailLoading = true;
      runtime.gmailError = '';
      if (state.activeTab === 'gmail') renderMainView();
      try {
        const list = await googleApiFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=15');
        const msgs = list.messages || [];
        const details = await Promise.all(
          msgs.map(m => googleApiFetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`))
        );
        runtime.gmailMessages = details.map(d => {
          const h = (name) => d.payload?.headers?.find(x => x.name.toLowerCase() === name.toLowerCase())?.value || '';
          return {
            id: d.id,
            subject: h('Subject') || '(No Subject)',
            from: h('From') || 'Unknown Sender',
            date: h('Date') || '',
            snippet: d.snippet || ''
          };
        });
        logAction('GMAIL_SYNC', `Fetched ${runtime.gmailMessages.length} live Gmail threads`);
      } catch (err) {
        runtime.gmailError = err.message;
      } finally {
        runtime.gmailLoading = false;

    async function sendDirectGmail(to, subject, bodyText) {
      const rawLines = [
        `To: ${to}`,
        `Subject: ${subject}`,
        'Content-Type: text/plain; charset="UTF-8"',
        '',
        bodyText
      ].join('\r\n');
      const encoded = btoa(unescape(encodeURIComponent(rawLines)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      await googleApiFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ raw: encoded })
      });
      logAction('GMAIL_API_SEND', `Sent email to ${to}`);
    }

    // 4. LIVE CHRONOLOGICAL GOOGLE NEWS (ALWAYS VISIBLE — PERSONALIZABLE)
    // =========================================================================
    async function fetchRssFeed(rssUrl, categoryLabel) {
      try {
        const r = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
        const j = await r.json();
        if (j.status === 'ok' && Array.isArray(j.items)) {
          return j.items.map(it => ({
            id: it.guid || it.link,
            title: it.title,
            link: it.link,
            pubDate: it.pubDate,
            ts: Date.parse(it.pubDate) || 0,
            source: it.author || categoryLabel,
            category: categoryLabel,
            summary: (it.description || '').replace(/<[^>]+>/g, '').slice(0, 220)
          }));
        }
      } catch {}

      const xmlRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(rssUrl)}`);
      const xmlText = await xmlRes.text();
      const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
      return Array.from(doc.querySelectorAll('item')).slice(0, 14).map(node => {
        const title = node.querySelector('title')?.textContent || '';
        const link = node.querySelector('link')?.textContent || '#';
        const pubDate = node.querySelector('pubDate')?.textContent || '';
        const source = node.querySelector('source')?.textContent || categoryLabel;
        const desc = (node.querySelector('description')?.textContent || '').replace(/<[^>]+>/g, '').slice(0, 220);
        return { id: link, title, link, pubDate, ts: Date.parse(pubDate) || 0, source, category: categoryLabel, summary: desc };
      });
    }

    async function loadLiveNews() {
      runtime.newsLoading = true;
      runtime.newsError = '';
      if (state.activeTab === 'news') renderMainView();

      const feeds = [];
      state.newsPrefs.categories.forEach(catId => {
        const found = NEWS_CATEGORIES.find(c => c.id === catId);
        if (found) feeds.push({ url: found.rss, label: found.label });
      });
      state.newsPrefs.customTopics.forEach(topic => {
        feeds.push({
          url: `https://news.google.com/rss/search?q=${encodeURIComponent(topic)}&hl=en-IN&gl=IN&ceid=IN:en`,
          label: `#${topic}`
        });
      });
      if (!feeds.length) feeds.push({ url: NEWS_CATEGORIES[0].rss, label: 'Top Stories' });

      try {
        const results = await Promise.allSettled(feeds.map(f => fetchRssFeed(f.url, f.label)));
        const merged = [];
        const seen = new Set();
        results.forEach(r => {
          if (r.status === 'fulfilled') {
            r.value.forEach(item => {
              if (!seen.has(item.title)) { seen.add(item.title); merged.push(item); }
            });
          }
        });
        merged.sort((a, b) => b.ts - a.ts);
        runtime.newsItems = merged.slice(0, 36);
        if (!runtime.newsItems.length) runtime.newsError = 'Live Google News feed could not be reached right now. Click Refresh.';
      } catch (err) {
        runtime.newsError = 'Feed error: ' + err.message;
      } finally {
        runtime.newsLoading = false;
        if (state.activeTab === 'news') renderMainView();
      }
    }

    function renderCRM() {

      return `
        <div class="grid-4">

    function bindDynamicEvents() {
      // News
      const pBtn = document.getElementById('personalizeNewsBtn');
      if (pBtn) pBtn.onclick = openPersonalizeNewsModal;
      const rBtn = document.getElementById('refreshNewsBtn') || document.getElementById('retryNewsBtn');
      if (rBtn) rBtn.onclick = loadLiveNews;

      const digestBtn = document.getElementById('aiNewsBriefBtn');
      if (digestBtn) {
        digestBtn.onclick = async () => {
          const box = document.getElementById('aiNewsDigestBox');
          box.style.display = 'block';
          box.textContent = 'Generating executive news brief via gemini-3.5-flash-lite...';
          const headlines = runtime.newsItems.slice(0, 14).map(n => `- [${n.category}] ${n.title} (${n.source})`).join('\n');
          box.textContent = await callGemini35FlashLite(`Create a sharp 5-bullet executive brief from these live headlines:\n${headlines}`);
        };
      }

      document.querySelectorAll('[data-like-news]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.likeNews;
          state.newsLikes[id] = !state.newsLikes[id];
          saveState();
          renderMainView();
        };
      });

      document.querySelectorAll('[data-comment-news]').forEach(btn => {
        btn.onclick = () => {
          const id = btn.dataset.commentNews;
          const txt = prompt('Add your note on this article:');
          if (txt && txt.trim()) {
            state.newsComments[id] = state.newsComments[id] || [];
            state.newsComments[id].push(txt.trim());
            logAction('NEWS_NOTE', txt.trim());
            renderMainView();
          }
        };
      });

      // CRM
      const addDealHandler = () => {
        const client = prompt('Client / Account Name:');
        if (!client || !client.trim()) return;
        const amount = Number(prompt('Deal Value in USD (numbers only):', '')) || 0;
        const probability = Number(prompt('Win Probability % (0-100):', '')) || 0;
        const id = 'DL-' + String(state.deals.length + 1).padStart(3, '0');
        state.deals.unshift({
          id,
          client: client.trim(),
          owner: state.user?.name || '',
          stage: 'Lead / Discovery',
          amount,
          probability,
          notes: []
        });
        logAction('CRM_DEAL_ADD', `${id} ${client.trim()} ($${amount})`);
        renderAll();
      };
      ['addDealBtn', 'emptyAddDealBtn'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.onclick = addDealHandler;
      });

      const toggleView = document.getElementById('toggleCrmViewBtn');
      if (toggleView) {
        toggleView.onclick = () => {
          state.crmView = state.crmView === 'table' ? 'kanban' : 'table';
          saveState();
          renderMainView();
        };
      }

      const aiScoreBtn = document.getElementById('aiScoreDealsBtn');
      if (aiScoreBtn) {
        aiScoreBtn.onclick = async () => {
          const box = document.getElementById('aiDealCoachBox');
          box.style.display = 'block';
          box.textContent = 'Running gemini-3.5-flash-lite pipeline diagnostics...';
          box.textContent = await callGemini35FlashLite(
            'Analyze all active deals, notes, and leads in my workspace. Score deal health, flag stalled risks, and list exact next actions.',
            { thinkingLevel: 'medium' }
          );
        };
      }

      const impBtn = document.getElementById('importCsvBtn');
      const csvInp = document.getElementById('csvFileInput');
      if (impBtn && csvInp) {
        impBtn.onclick = () => csvInp.click();
        csvInp.onchange = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const lines = (await file.text()).split(/\r?\n/).filter(Boolean);
          lines.slice(1).forEach(line => {
            const [client, amount, probability, stage] = line.split(',').map(s => s?.trim());
            if (client) {
              state.deals.unshift({
                id: 'DL-' + String(state.deals.length + 1).padStart(3, '0'),
                client,
                owner: state.user?.name || '',
                stage: stage || 'Lead / Discovery',
                amount: Number(amount) || 0,
                probability: Number(probability) || 0,
                notes: []
              });
            }
          });
          logAction('CRM_CSV_IMPORT', `Imported ${Math.max(0, lines.length - 1)} rows`);
          renderAll();
        };
      }

      const expDeals = document.getElementById('exportDealsBtn');
      if (expDeals) {
        expDeals.onclick = () => {
          const rows = ['ID\tClient\tOwner\tStage\tAmount\tProbability\tLatestNote']
            .concat(state.deals.map(d => `${d.id}\t${d.client}\t${d.owner}\t${d.stage}\t${d.amount}\t${d.probability}%\t${(d.notes || []).slice(-1)[0] || ''}`));
          downloadFile('QUASAR13_Deals.xls', rows.join('\n'), 'application/vnd.ms-excel');
        };
      }

      document.querySelectorAll('[data-advance-deal]').forEach(btn => {
        btn.onclick = () => {
          const stages = ['Lead / Discovery', 'Proposal', 'Negotiation', 'Closed Won'];
          const d = state.deals.find(x => x.id === btn.dataset.advanceDeal);
          if (!d) return;
          d.stage = stages[(stages.indexOf(d.stage) + 1) % stages.length];
          logAction('CRM_DEAL_STAGE', `${d.id} → ${d.stage}`);
          renderAll();
        };
      });

      document.querySelectorAll('[data-note-deal]').forEach(btn => {
        btn.onclick = () => {
          const d = state.deals.find(x => x.id === btn.dataset.noteDeal);
          const note = prompt(`Log note for ${d.client}:`);
          if (note && note.trim()) {
            d.notes = d.notes || [];
            d.notes.push(`[${nowStamp().slice(0, 16)}] ${note.trim()}`);
            logAction('CRM_DEAL_NOTE', `${d.id}: ${note.trim()}`);
            renderAll();
          }
        };
      });

    // Dense Multi-Layer Parallax Technical Vector Canvas
    function initVectorCanvas() {
      const canvas = document.getElementById('vector-canvas');
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);
      window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });

      const count = w < 768 ? 85 : 145;
      const kinds = ['stack', 'hex', 'node', 'ring', 'glyph'];
      const glyphs = ['01', 'SQL', 'API', 'P2P', 'E2E', 'AI', 'DB', '13'];
      const particles = Array.from({ length: count }, (_, i) => ({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5,
        size: 8 + Math.random() * 14, kind: kinds[i % kinds.length],
        glyph: glyphs[i % glyphs.length], rot: Math.random() * Math.PI * 2
      }));

      const shade = (v, fb) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || fb;

      function draw() {
        ctx.clearRect(0, 0, w, h);
        const c1 = shade('--s-300', '#38bdf8');
        const c2 = shade('--s-500', '#0a84ff');
        const c3 = shade('--s-200', '#7dd3fc');
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.rot += 0.004;
          if (p.x < -30) p.x = w + 30; if (p.x > w + 30) p.x = -30;
          if (p.y < -30) p.y = h + 30; if (p.y > h + 30) p.y = -30;

          for (let j = i + 1; j < particles.length; j++) {
            const q = particles[j];
            const dist = Math.hypot(p.x - q.x, p.y - q.y);
            if (dist < 115) {
              ctx.strokeStyle = c2;
              ctx.globalAlpha = (1 - dist / 115) * 0.26;
              ctx.lineWidth = 0.8;
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
            }
          }
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.strokeStyle = i % 2 === 0 ? c1 : c3; ctx.fillStyle = c1;
          ctx.globalAlpha = 0.4; ctx.lineWidth = 1.1;
          if (p.kind === 'stack') {
            for (let s = -1; s <= 1; s++) ctx.strokeRect(-p.size * 0.6, s * 5 - 2, p.size * 1.2, 3.5);
          } else if (p.kind === 'hex') {
            ctx.beginPath();
            for (let k = 0; k < 6; k++) {
              const a = (Math.PI / 3) * k;
              k === 0 ? ctx.moveTo(Math.cos(a) * p.size * 0.75, Math.sin(a) * p.size * 0.75) : ctx.lineTo(Math.cos(a) * p.size * 0.75, Math.sin(a) * p.size * 0.75);
            }
            ctx.closePath(); ctx.stroke();
          } else if (p.kind === 'ring') {
            ctx.beginPath(); ctx.arc(0, 0, p.size * 0.7, 0, Math.PI * 2); ctx.stroke();
          } else if (p.kind === 'glyph') {
            ctx.font = '600 10px JetBrains Mono, monospace'; ctx.fillText(p.glyph, -10, 4);
          } else {
            ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    // Boot Sequence
    initVectorCanvas();
    renderAll();
    loadLiveNews();
    initFirebaseIfConfigured().then(() => {
      if (state.user && runtime.googleAccessToken) {
        fetchAllGoogleWorkspaceData();
      } else if (state.user && config.googleOAuthClientId) {
        setTimeout(() => authorizeWithGoogle(state.user.email), 1200);
      }
    });
  </script>
</body>
